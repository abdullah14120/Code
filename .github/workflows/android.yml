name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Apps (User & Admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # خطوة فحص الأكواد والتحقق من السلامة البرمجية للموديلات
      - name: Run Code Lint and Tests
        run: ./gradlew test

      # بناء تطبيق المستخدم (com.code.w) بصيغة APK التجريبية
      - name: Build User App (APK)
        run: ./gradlew :app:assembleDebug

      # بناء تطبيق الأدمن (com.code.w.admin) بصيغة APK التجريبية
      - name: Build Admin App (APK)
        run: ./gradlew :admin:assembleDebug

      # رفع ملفات الـ APK الناتجة لحفظها كـ Artifacts يمكنك تحميلها مباشرة من جيتهاب
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: User-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Admin-App-Debug
          path: admin/build/outputs/apk/debug/admin-debug.apk
