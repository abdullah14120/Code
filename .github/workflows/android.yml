name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Apps (User & Admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Validate or Generate Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar missing, generating..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APKs (User & Admin)
        run: ./gradlew :app:assembleRelease :admin:assembleRelease --stacktrace

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: User-App-Release-Unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Admin-App-Release-Unsigned
          path: admin/build/outputs/apk/release/*.apk
