name: Android CI - Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Unit Tests & Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (:common, :app, :admin)
        run: ./gradlew :common:testDebugUnitTest :app:testDebugUnitTest :admin:testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            common/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            admin/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APKs (:app and :admin)
        run: ./gradlew :app:assembleDebug :admin:assembleDebug --stacktrace

      - name: Upload User App APK (:app)
        uses: actions/upload-artifact@v4
        with:
          name: user-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Admin App APK (:admin)
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-debug-apk
          path: admin/build/outputs/apk/debug/*.apk
